# Reverse proxy for all sites on this host.
#
# This stack OWNS the `traefik-proxy` network. Start it before any app stack
# that declares `traefik-proxy` as external
#
# Static configuration lives in `command:` rather than a traefik.yaml, because
# Traefik does not expand ${VARS} inside its static config file - flags do get
# Compose interpolation, so .env stays the single place to configure this stack.
# Dynamic configuration (TLS options) is a watched file in ./config/dynamic.

name: traefik

services:
  traefik:
    image: traefik:v3.7.13
    container_name: traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command:
      - --global.checknewversion=false
      - --global.sendanonymoususage=false
      - --log.level=${TRAEFIK_LOG_LEVEL:-INFO}
      - --accesslog=true
      - --accesslog.filepath=/var/log/traefik/access.log
      - --ping=true

      # --- Entrypoints (names must match the app stacks' router labels) ---
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http3=true
      # Trust no client-supplied X-Forwarded-* headers: this is the edge.
      - --entrypoints.web.forwardedheaders.insecure=false
      - --entrypoints.websecure.forwardedheaders.insecure=false
      # Cap request duration so a slowloris client can't pin a connection open.
      - --entrypoints.web.transport.respondingtimeouts.readtimeout=60s
      - --entrypoints.websecure.transport.respondingtimeouts.readtimeout=60s

      # --- Providers ---
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=traefik-proxy
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true

      # --- ACME / Let's Encrypt (resolver name is referenced by app labels) ---
      # HTTP-01 challenge: needs port 80 reachable from the internet for every
      # domain that requests a certificate.
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?missing ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.letsencrypt.acme.caserver=${ACME_CA_SERVER:-https://acme-v02.api.letsencrypt.org/directory}

      # --- Dashboard (routed below, never via api.insecure) ---
      - --api.dashboard=true
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp' # HTTP/3
    volumes:
      # Read-only socket: Traefik only needs to discover containers and their labels.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config/dynamic:/etc/traefik/dynamic:ro
      # Traefik creates acme.json here with 0600 on first run.
      - ./letsencrypt:/letsencrypt
      - ./logs:/var/log/traefik
    environment:
      TZ: ${TZ:-Europe/Berlin}
    healthcheck:
      test: ['CMD', 'traefik', 'healthcheck', '--ping']
      start_period: 10s
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-proxy

      # Dashboard - HTTPS only, behind basic auth. Point TRAEFIK_DOMAIN at this
      # host (A record); the default never matches a public request.
      - traefik.http.routers.traefik-dashboard.rule=Host(`${TRAEFIK_DOMAIN:-traefik.localhost}`)
      - traefik.http.routers.traefik-dashboard.entrypoints=websecure
      - traefik.http.routers.traefik-dashboard.tls.certresolver=letsencrypt
      - traefik.http.routers.traefik-dashboard.service=api@internal
      - traefik.http.routers.traefik-dashboard.middlewares=dashboard-auth
      - traefik.http.middlewares.dashboard-auth.basicauth.users=${TRAEFIK_DASHBOARD_AUTH:?missing TRAEFIK_DASHBOARD_AUTH}

      # Plain HTTP for the dashboard host redirects to HTTPS.
      - traefik.http.routers.traefik-dashboard-http.rule=Host(`${TRAEFIK_DOMAIN:-traefik.localhost}`)
      - traefik.http.routers.traefik-dashboard-http.entrypoints=web
      - traefik.http.routers.traefik-dashboard-http.service=api@internal
      - traefik.http.routers.traefik-dashboard-http.middlewares=dashboard-https
      - traefik.http.middlewares.dashboard-https.redirectscheme.scheme=https
      - traefik.http.middlewares.dashboard-https.redirectscheme.permanent=true
    networks:
      - traefik-proxy

networks:
  # Created by this stack under the literal name `traefik-proxy`; app stacks
  # join it as an external network.
  traefik-proxy:
    name: traefik-proxy
